name: Build & Release Cross-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.rid }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: windows-latest
            rid: win-arm64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test tests/LogTail.Core.Tests/LogTail.Core.Tests.csproj --configuration Release

      - name: Publish Binary
        run: |
          dotnet publish src/LogTail.UI/LogTail.UI.csproj \
            -c Release \
            -r ${{ matrix.target.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o ./out

      - name: Package Artifact (Windows)
        if: matrix.target.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ./out/* -DestinationPath LogTail-${{ matrix.target.rid }}.zip

      - name: Package Artifact (Linux/macOS)
        if: matrix.target.os != 'windows-latest'
        shell: bash
        run: |
          cd out && tar -czvf ../LogTail-${{ matrix.target.rid }}.tar.gz * && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogTail-${{ matrix.target.rid }}
          path: LogTail-${{ matrix.target.rid }}.${{ matrix.target.archive_ext }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine Release Type & Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_tag=preview-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "release_name=Pre-release (${SHORT_SHA})" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_name }}
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
